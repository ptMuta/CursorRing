name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Enforce comment-free C#
        shell: pwsh
        run: |
          $matches = git ls-files '*.cs' | ForEach-Object { Select-String -Path $_ -Pattern '//|/\*|\*/' }
          if ($matches) {
            $matches
            exit 1
          }

      - name: Restore
        run: dotnet restore CursorRing.sln --locked-mode

      - name: Verify formatting
        run: dotnet format CursorRing.sln --verify-no-changes --no-restore

      - name: Build Debug
        run: dotnet build CursorRing.sln --configuration Debug --no-restore

      - name: Build Benchmark
        run: dotnet build CursorRing.sln --configuration Benchmark --no-restore

      - name: Verify Benchmark development plugin
        shell: pwsh
        run: |
          $output = '.\CursorRing\bin\x64\Benchmark'
          if (-not (Test-Path "$output\CursorRing.dll") -or -not (Test-Path "$output\CursorRing.json")) {
            throw 'Benchmark development plugin output is incomplete.'
          }
          $manifest = Get-Content "$output\CursorRing.json" -Raw | ConvertFrom-Json
          if (-not $manifest.InternalName -or -not $manifest.AssemblyVersion -or -not $manifest.DalamudApiLevel) {
            throw 'Benchmark development plugin manifest is incomplete.'
          }

      - name: Build Release
        run: dotnet build CursorRing.sln --configuration Release --no-restore

      - name: Verify benchmark exclusion
        shell: pwsh
        run: |
          $assemblyPath = '.\CursorRing\bin\x64\Release\CursorRing.dll'
          $assemblyBytes = [System.IO.File]::ReadAllBytes($assemblyPath)
          $assemblyText = [System.Text.Encoding]::UTF8.GetString($assemblyBytes)
          $assemblyHex = [Convert]::ToHexString($assemblyBytes)
          $markers = 'RenderBenchmark', 'RenderWork', 'DrawMeasured', 'GetAllocatedBytesForCurrentThread', '/cursorring benchmark'
          $foundMarkers = $markers | Where-Object {
            $unicodeHex = [Convert]::ToHexString([System.Text.Encoding]::Unicode.GetBytes($_))
            $assemblyText.Contains($_) -or $assemblyHex.Contains($unicodeHex)
          }
          if ($foundMarkers) {
            throw "Release assembly contains benchmark code: $($foundMarkers -join ', ')"
          }

      - name: Test
        run: dotnet test CursorRing.Tests\CursorRing.Tests.csproj --configuration Release --property:Platform=x64 --no-build --no-restore

      - name: Validate package
        shell: pwsh
        run: |
          $archivePath = '.\CursorRing\bin\x64\Release\CursorRing\latest.zip'
          if (-not (Test-Path $archivePath)) {
            throw 'Release package was not created.'
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $names = $archive.Entries.Name
            if ('CursorRing.dll' -notin $names -or 'CursorRing.json' -notin $names) {
              throw 'Release package is incomplete.'
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Validate custom repository
        shell: pwsh
        run: |
          $entries = @(Get-Content '.\repo.json' -Raw | ConvertFrom-Json)
          if ($entries.Count -ne 1) {
            throw 'Custom repository must contain exactly one entry.'
          }
          $entry = $entries[0]
          $required = 'Author', 'Name', 'InternalName', 'AssemblyVersion', 'Description', 'ApplicableVersion', 'DalamudApiLevel', 'Punchline', 'RepoUrl', 'IconUrl', 'DownloadLinkInstall', 'DownloadLinkUpdate', 'LastUpdate'
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([string]$entry.$_) }
          if ($missing) {
            throw "Custom repository is missing: $($missing -join ', ')"
          }
          if ($entry.IsHide -ne $false -or $entry.IsTestingExclusive -ne $false) {
            throw 'Custom repository entry must be visible and installable without testing mode.'
          }
          foreach ($property in 'RepoUrl', 'IconUrl', 'DownloadLinkInstall', 'DownloadLinkUpdate') {
            $uri = [Uri]$entry.$property
            if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https') {
              throw "$property must be an absolute HTTPS URL."
            }
          }
          if ($entry.DownloadLinkInstall -ne $entry.DownloadLinkUpdate) {
            throw 'Install and update links must reference the same release package.'
          }
          if ([string]$entry.LastUpdate -notmatch '^\d+$') {
            throw 'LastUpdate must be a Unix timestamp.'
          }
          if ([long]$entry.LastUpdate -gt [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) {
            throw 'LastUpdate cannot be in the future.'
          }
          $archivePath = '.\CursorRing\bin\x64\Release\CursorRing\latest.zip'
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $manifestEntry = $archive.GetEntry('CursorRing.json')
            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try {
              $manifest = $reader.ReadToEnd() | ConvertFrom-Json
            }
            finally {
              $reader.Dispose()
            }
          }
          finally {
            $archive.Dispose()
          }
          foreach ($property in 'Author', 'Name', 'InternalName', 'Description', 'ApplicableVersion', 'DalamudApiLevel', 'Punchline', 'IconUrl', 'AcceptsFeedback') {
            if ($entry.$property -ne $manifest.$property) {
              throw "Custom repository $property does not match the packaged manifest."
            }
          }
          if ([version]$entry.AssemblyVersion -gt [version]$manifest.AssemblyVersion) {
            throw 'Custom repository AssemblyVersion cannot exceed the packaged manifest.'
          }
          if ([version]$entry.AssemblyVersion -eq [version]$manifest.AssemblyVersion) {
            $expectedLink = "https://github.com/ptMuta/CursorRing/releases/download/$($manifest.AssemblyVersion -replace '\.(\d+)$', '-rc$1')/latest.zip"
            if ($entry.DownloadLinkInstall -ne $expectedLink) {
              throw "Predictive release package URL must be $expectedLink."
            }
          }
          else {
            $response = Invoke-WebRequest -Uri $entry.DownloadLinkInstall -Method Head
            if ($response.StatusCode -ne 200) {
              throw "Release package returned HTTP $($response.StatusCode)."
            }
          }

      - name: Store artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CursorRing
          path: .\CursorRing\bin\x64\Release\CursorRing\latest.zip
          if-no-files-found: error
          retention-days: 1
